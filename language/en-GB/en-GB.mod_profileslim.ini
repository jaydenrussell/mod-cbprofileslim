MOD_PROFILESLIM="Joomla Profile Slim Display"
MOD_PROFILESLIM_XML_DESCRIPTION="Standalone module: displays the logged-in user's display name and avatar in the top header navbar using Joomla's built-in profile system. When Community Builder is installed, the profile link optionally follows CB's canonical View Profile menu item."
MOD_PROFILESLIM_PROFILE_URL_LABEL="Profile URL"
MOD_PROFILESLIM_PROFILE_URL_DESC="Override the profile link. Accepts an absolute http(s) URL or a safe site-relative path. Leave empty for Joomla's default profile link (Community Builder's canonical menu item when that extension is installed)."
MOD_PROFILESLIM_PROFILE_ITEMID_LABEL="Profile Menu Item ID"
MOD_PROFILESLIM_PROFILE_ITEMID_DESC="Itemid of the canonical 'View Profile' menu item used when Community Builder is installed. Use 0 for automatic detection."
MOD_PROFILESLIM_AVATAR_SIZE_LABEL="Avatar Size"
MOD_PROFILESLIM_AVATAR_SIZE_DESC="Select the avatar size in pixels"
MOD_PROFILESLIM_AVATAR_ALIGN_LABEL="Avatar Vertical Alignment"
MOD_PROFILESLIM_AVATAR_ALIGN_DESC="How the avatar aligns vertically with the header text"
MOD_PROFILESLIM_CONTAINER_PADDING_LABEL="Container Padding"
MOD_PROFILESLIM_CONTAINER_PADDING_DESC="CSS padding for the container (e.g. 0 0 0 0)"
MOD_PROFILESLIM_CONTAINER_MARGIN_LABEL="Container Margin"
MOD_PROFILESLIM_CONTAINER_MARGIN_DESC="CSS margin for the container (e.g. 0)"
MOD_PROFILESLIM_AVATAR_BASE_PATH_LABEL="Avatar Base Path"
MOD_PROFILESLIM_AVATAR_BASE_PATH_DESC="Directory (relative to site root) where avatar files are stored. Default matches Joomla's standard images directory."
MOD_PROFILESLIM_AVATAR_DB_FALLBACK_LABEL="Avatar DB Fallback"
MOD_PROFILESLIM_AVATAR_DB_FALLBACK_DESC="OFF (default): avatar uses Joomla user profile data only. ON: falls back to a direct #__user_profiles database query when the profile API returns nothing."